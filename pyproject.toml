[tool.poetry]
name = "camera-traps-wild-life"
version = "2.0.1"
description = "Machine Learning-powered camera trap wildlife"
authors = ["PFoini <pietro.foini1@gmail.com>"]
readme = "README.md"
packages = [{ include = "camera_traps" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
# Web App & API
uvicorn = "0.52.4"
fastapi = "0.141.1"
# Data Processing & Config
numpy = "2.4.6"
pydantic = "2.13.5"
pydantic-settings = "2.8.1"
# Computer Vision & Models
trackers = "2.6.0"
supervision = "0.30.2"
av = "18.1.0"
ai-edge-litert = "2.2.0"
# Storage
boto3 = "1.43.114"
# Database & ORM
SQLAlchemy = "2.0.52"
psycopg2-binary = "2.9.13"
# GPU support
ultralytics = { version = "8.4.143", optional = true }
torch = { version = "2.11.0", source = "pytorch-cu128", optional = true }
torchvision = { version = "0.26.0", source = "pytorch-cu128", optional = true }
tensorflow = { version = "2.21.0", extras = ["and-cuda"], optional = true }
# CPU support (not compatiple with GPU support)
#torch = { version = "2.11.0", source = "pytorch-cpu", optional = true }
#torchvision = { version = "0.26.0", source = "pytorch-cpu", optional = true }
#tensorflow-cpu = { version = "2.21.0", optional = true }

[tool.poetry.group.dev.dependencies]
# Development Tools
isort = "^5.12"
black = "^22"
mypy = "^1.3"
pre-commit = "^4.3.0"
pydocstyle = "^6.3"
# Notebook Environment
notebook = "7.6.2"
traitlets = "5.16.1"
imagesize = "2.0.1"
ipywidgets = "8.1.9"
matplotlib = "3.11.1"
scikit-learn = "1.9.0"
setuptools = "81.0.0"

[tool.poetry.group.test.dependencies]
pytest-mock = "^3.7.0"
mock = "^4.0.3"
pytest = "7.1.2"
httpx2 = "2.12.0"

[tool.poetry.extras]
gpu = ["torch", "torchvision", "ultralytics", "tensorflow"]
#cpu = ["torch", "torchvision", "ultralytics", "tensorflow-cpu"]

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
exclude = '''
/(\n  \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | _build\n  | buck-out\n  | build\n  | dist\n  | dockerfile\n  | \.md\n  | \.txt\n  | \.gitignore\n  | \.lock\n)/\n
'''

[tool.isort]
skip_glob = ["*/tests/*"]
profile = "black"
line_length = 120
